<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
<title>JIXUN AI Codec · Handset J, voice pulse and crossed microphones</title>
<desc>A hooked telephone handset forms J. An irregular voice trace connects it to two crossed microphones forming X.</desc>
<defs>
  <linearGradient id="handset" x1="99" y1="129" x2="176" y2="376" gradientUnits="userSpaceOnUse"><stop stop-color="#A2EDCA"/><stop offset="1" stop-color="#70CFA6"/></linearGradient>
  <linearGradient id="pulse" x1="185" y1="245" x2="311" y2="245" gradientUnits="userSpaceOnUse"><stop stop-color="#70CFA6"/><stop offset=".6" stop-color="#B2F1D2"/><stop offset="1" stop-color="#9FC7E8"/></linearGradient>
  <clipPath id="mic-head"><rect x="-16" y="-120" width="32" height="53" rx="16"/></clipPath>
</defs>
<rect width="512" height="512" rx="120" fill="#14271F"/>
<rect x="19" y="19" width="474" height="474" rx="103" stroke="#91E4BD" stroke-opacity=".14" stroke-width="2"/>
<!-- J: sculpted handset, broad ear capsule, curved bridge, and returning mouth capsule. -->
<path d="M113 154h61v137c0 49-25 78-64 78-20 0-37-9-49-24" stroke="url(#handset)" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="88" y="123" width="65" height="57" rx="22" fill="#9CE8C4"/>
<path d="M109 137v27m12-27v27m12-27v27" stroke="#244C39" stroke-width="4" stroke-linecap="round" opacity=".7"/>
<g transform="translate(76 343) rotate(-36)">
 <rect x="-29" y="-23" width="63" height="50" rx="20" fill="#7AD6AD"/>
 <path d="M-8-11v26m12-26v26m12-26v26" stroke="#244C39" stroke-width="4" stroke-linecap="round" opacity=".7"/>
</g>
<!-- Organic, intentionally uneven speech trace instead of an equaliser. -->
<path d="M195 251h9l7-13 8 30 10-57 11 84 12-111 12 90 10-42 9 29 7-12h14" stroke="url(#pulse)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<!-- Two microphones: rear stem is interrupted at the crossing for a woven, legible X. -->
<g transform="translate(368 262) rotate(-32)">
 <rect x="-16" y="-120" width="32" height="53" rx="16" fill="#AAD0EB"/>
 <g clip-path="url(#mic-head)" stroke="#365A6D" stroke-width="3" opacity=".8"><path d="M-18-108h36m-36 10h36m-36 10h36m-36 10h36"/><path d="M-5-122v57m10-57v57"/></g>
 <path d="M-11-62h22v49h-22Zm0 91h22v72c0 8-22 8-22 0Z" fill="#92BBDD"/>
 <path d="M-12 80h24" stroke="#395D70" stroke-width="4"/>
</g>
<g transform="translate(368 262) rotate(32)">
 <rect x="-16" y="-120" width="32" height="53" rx="16" fill="#A0EDCA"/>
 <g clip-path="url(#mic-head)" stroke="#326148" stroke-width="3" opacity=".8"><path d="M-18-108h36m-36 10h36m-36 10h36m-36 10h36"/><path d="M-5-122v57m10-57v57"/></g>
 <path d="M-11-62h22v163c0 8-22 8-22 0Z" fill="#7EDBB1"/>
 <path d="M-12 80h24" stroke="#326148" stroke-width="4"/>
</g>
</svg>